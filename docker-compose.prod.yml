# Server deployment — pulls the pre-built image from the local registry.
# Edge/offline: use docker-compose.edge.yml instead (icrcs-net + .env.edge).
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  web:
    container_name: icrcs-fe-portal
    image: 10.248.0.7:30000/icrcs-fe-portal:${IMAGE_TAG:-v1.8.0}
    pull_policy: always
    ports:
      - "6060:6060"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=6060
      - HOSTNAME=0.0.0.0
    networks:
      - icrcs-net
    restart: unless-stopped

networks:
  icrcs-net:
    name: icrcs-net
    external: true
