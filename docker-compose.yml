# Local build + run. For edge/offline LAN see docker-compose.edge.yml.
services:
  web:
    container_name: icrcs-fe-portal
    image: 10.248.0.7:30000/icrcs-fe-portal:v1.6.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6060:6060"
    env_file:
      - .env
    environment:
      - PORT=6060
      - HOSTNAME=0.0.0.0
    networks:
      - icrcs-net
    restart: unless-stopped

networks:
  icrcs-net:
    name: icrcs-net
    external: true